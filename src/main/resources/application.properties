spring.config.import=optional:file:.env[.properties]

spring.application.name=backoffice


spring.profiles.active=dev

spring.graphql.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4321}
# PostgreSQL datasource composed from .env values
spring.datasource.url=jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:products}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.jwt.secret=${JWT_SECRET:change-me-to-a-long-secret-with-at-least-256-bits}
security.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
security.jwt.refresh-token-cookie-name=refreshToken
security.jwt.refresh-token-cookie-path=/api/auth
security.jwt.refresh-token-cookie-secure=${REFRESH_TOKEN_COOKIE_SECURE:false}
security.jwt.refresh-token-cookie-same-site=Strict